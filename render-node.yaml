services:
  - type: web
    name: fruit-freshness-api-node
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start --prefix backend-node
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://carlos-leo-klasifikasi-kesegaran-buah.static.hf.space
