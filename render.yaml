services:
  - type: web
    name: fruit-freshness-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m backend.download_model
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_REPO_ID
        value: Carlos-leo/klasifikasi-kesegaran-buah
      - key: MODEL_REPO_TYPE
        value: space
      - key: CORS_ORIGINS
        value: https://carlos-leo-klasifikasi-kesegaran-buah.static.hf.space,http://localhost:5000,http://127.0.0.1:5000
